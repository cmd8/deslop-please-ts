<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="module-cycle: before, the modules header and barcode use each other; after, only header uses barcode">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.muted { fill: #656d76; }
.bold { font-weight: 600; }
.head { font-size: 15px; font-weight: 600; }
.panel { fill: #f6f8fa; stroke: #d0d7de; }
