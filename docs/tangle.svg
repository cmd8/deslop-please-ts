<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="tangle: before, Tasks in kernel and Timers in its child module timers know each other, with no module cycle; after, tick in kernel calls both and Timers no longer knows Tasks">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .small { font-size: 12px; }
    .code { font-size: 11px; }
    .muted { fill: #656d76; }
    .bold { font-weight: 600; }
    .canvas { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; }
    .mod { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .box { fill: none; stroke: #afb8c1; stroke-width: 1.2; }
    .private { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tree { stroke: #afb8c1; stroke-width: 1.5; fill: none; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .thin { stroke: #8c959f; stroke-width: 1.2; fill: none; }
    .bad { stroke: #cf222e; stroke-width: 1.8; fill: none; }
    .good { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .badtext { fill: #cf222e; }
    .goodtext { fill: #1a7f37; }
    .badbox { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .goodbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
    .tip-n { fill: #57606a; } .tip-t { fill: #8c959f; } .tip-b { fill: #cf222e; } .tip-g { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #8d96a0; }
      .canvas { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; }
      .mod, .private { fill: #0d1117; stroke: #6e7681; }
      .box, .tree { stroke: #484f58; }
      .edge { stroke: #8d96a0; }
      .thin { stroke: #6e7681; }
      .bad { stroke: #f85149; }
      .good { stroke: #3fb950; }
      .badtext { fill: #f85149; }
      .goodtext { fill: #3fb950; }
      .badbox { fill: #3c1618; stroke: #f85149; }
      .goodbox { fill: #12261e; stroke: #3fb950; }
      .tip-n { fill: #8d96a0; } .tip-t { fill: #6e7681; } .tip-b { fill: #f85149; } .tip-g { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-n"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-t"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-g"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="799" height="319" rx="8"/>
  <rect class="panel" x="10" y="10" width="380" height="300" rx="6"/>
  <rect class="panel" x="410" y="10" width="380" height="300" rx="6"/>
  <rect class="badbox" x="22" y="20" width="64" height="22" rx="11"/>
  <text class="bold small badtext" x="54" y="35" text-anchor="middle">Before</text>
  <rect class="goodbox" x="422" y="20" width="56" height="22" rx="11"/>
  <text class="bold small goodtext" x="450" y="35" text-anchor="middle">After</text>
  <!-- Before -->
  <rect class="box" x="25" y="60" width="350" height="235" rx="6"/>
  <text class="mono muted" x="35" y="78">kernel</text>
  <rect class="box" x="190" y="100" width="178" height="175" rx="6"/>
  <text class="mono muted" x="200" y="118">timers</text>
  <path class="bad" d="M129.2,195.5 Q192,145 245.0,178.5" marker-end="url(#b)"/>
  <path class="bad" d="M257.2,219.5 Q192,278 134.7,236.5" marker-end="url(#b)"/>
  <rect class="badbox" x="32.0" y="196.5" width="146.0" height="37" rx="5"/>
  <text class="mono bold badtext" x="105.0" y="212.5" text-anchor="middle">Tasks</text>
  <text class="mono code muted" x="105.0" y="227.5" text-anchor="middle">timers.arm(id, 10)</text>
  <rect class="badbox" x="220.0" y="181.5" width="118.0" height="37" rx="5"/>
  <text class="mono bold badtext" x="279.0" y="197.5" text-anchor="middle">Timers</text>
  <text class="mono code muted" x="279.0" y="212.5" text-anchor="middle">tasks.wake(id)</text>
  <text class="small muted" x="375" y="35" text-anchor="end">2 things know each other, across 2 modules</text>
  <!-- After -->
  <rect class="box" x="425" y="60" width="350" height="235" rx="6"/>
  <text class="mono muted" x="435" y="78">kernel</text>
  <rect class="box" x="590" y="100" width="178" height="175" rx="6"/>
  <text class="mono muted" x="600" y="118">timers</text>
  <path class="good" d="M505.0,139.0 L505.0,203.5" marker-end="url(#g)"/>
  <path class="good" d="M558.4,139.0 L636.5,178.5" marker-end="url(#g)"/>
  <path class="thin" d="M579.0,214.4 L592.5,212.4" marker-end="url(#t)"/>
  <rect class="goodbox" x="439.0" y="86.0" width="132.0" height="52" rx="5"/>
  <text class="mono bold goodtext" x="505.0" y="102.0" text-anchor="middle">tick()</text>
  <text class="mono code muted" x="505.0" y="117.0" text-anchor="middle">timers.fire(now)</text>
  <text class="mono code muted" x="505.0" y="132.0" text-anchor="middle">tasks.wake(id)</text>
  <rect class="mod" x="432.0" y="206.5" width="146.0" height="37" rx="5"/>
  <text class="mono bold" x="505.0" y="222.5" text-anchor="middle">Tasks</text>
  <text class="mono code muted" x="505.0" y="237.5" text-anchor="middle">timers.arm(id, 10)</text>
  <rect class="mod" x="595.5" y="181.5" width="167.0" height="37" rx="5"/>
  <text class="mono bold" x="679.0" y="197.5" text-anchor="middle">Timers</text>
  <text class="mono code muted" x="679.0" y="212.5" text-anchor="middle">fire(now) -&gt; Vec&lt;u32&gt;</text>
  <text class="small muted" x="775" y="35" text-anchor="end">Timers no longer knows Tasks</text>
</svg>
