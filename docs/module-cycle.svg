<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="module-cycle: before, modules kinds and socket use each other, though listen, Stream::new and BACKLOG_MOST only form a chain; after, BACKLOG_MOST moves into kinds and only socket uses kinds">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .small { font-size: 12px; }
    .code { font-size: 11px; }
    .muted { fill: #656d76; }
    .bold { font-weight: 600; }
    .canvas { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; }
    .mod { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .box { fill: none; stroke: #afb8c1; stroke-width: 1.2; }
    .private { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tree { stroke: #afb8c1; stroke-width: 1.5; fill: none; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .thin { stroke: #8c959f; stroke-width: 1.2; fill: none; }
    .bad { stroke: #cf222e; stroke-width: 1.8; fill: none; }
    .good { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .badtext { fill: #cf222e; }
    .goodtext { fill: #1a7f37; }
    .badbox { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .goodbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
    .tip-n { fill: #57606a; } .tip-t { fill: #8c959f; } .tip-b { fill: #cf222e; } .tip-g { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #8d96a0; }
      .canvas { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; }
      .mod, .private { fill: #0d1117; stroke: #6e7681; }
      .box, .tree { stroke: #484f58; }
      .edge { stroke: #8d96a0; }
      .thin { stroke: #6e7681; }
      .bad { stroke: #f85149; }
      .good { stroke: #3fb950; }
      .badtext { fill: #f85149; }
      .goodtext { fill: #3fb950; }
      .badbox { fill: #3c1618; stroke: #f85149; }
      .goodbox { fill: #12261e; stroke: #3fb950; }
      .tip-n { fill: #8d96a0; } .tip-t { fill: #6e7681; } .tip-b { fill: #f85149; } .tip-g { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-n"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-t"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-g"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="799" height="319" rx="8"/>
  <rect class="panel" x="10" y="10" width="380" height="300" rx="6"/>
  <rect class="panel" x="410" y="10" width="380" height="300" rx="6"/>
  <rect class="badbox" x="22" y="20" width="64" height="22" rx="11"/>
  <text class="bold small badtext" x="54" y="35" text-anchor="middle">Before</text>
  <rect class="goodbox" x="422" y="20" width="56" height="22" rx="11"/>
  <text class="bold small goodtext" x="450" y="35" text-anchor="middle">After</text>
  <!-- Before -->
  <rect class="badbox" x="25" y="70" width="155" height="215" rx="6"/>
  <text class="mono badtext" x="35" y="88">kinds</text>
  <rect class="badbox" x="215" y="70" width="160" height="215" rx="6"/>
  <text class="mono badtext" x="225" y="88">socket</text>
  <path class="edge" d="M231.5,143.1 L167.5,161.3" marker-end="url(#n)"/>
  <path class="edge" d="M164.7,199.5 L243.5,224.0" marker-end="url(#n)"/>
  <rect class="mod" x="39.5" y="161.5" width="125.0" height="37" rx="5"/>
  <text class="mono bold" x="102.0" y="177.5" text-anchor="middle">Stream::new</text>
  <text class="mono code muted" x="102.0" y="192.5" text-anchor="middle">&lt;= BACKLOG_MOST</text>
  <rect class="mod" x="232.5" y="106.5" width="125.0" height="37" rx="5"/>
  <text class="mono bold" x="295.0" y="122.5" text-anchor="middle">listen()</text>
  <text class="mono code muted" x="295.0" y="137.5" text-anchor="middle">Stream::new(..)</text>
  <rect class="mod" x="241.2" y="227.0" width="107.6" height="26" rx="5"/>
  <text class="mono" x="295.0" y="244" text-anchor="middle">BACKLOG_MOST</text>
  <text class="small muted" x="375" y="35" text-anchor="end">2 modules use each other in a circle</text>
  <!-- After -->
  <rect class="box" x="425" y="70" width="155" height="215" rx="6"/>
  <text class="mono muted" x="435" y="88">kinds</text>
  <rect class="box" x="615" y="70" width="160" height="215" rx="6"/>
  <text class="mono muted" x="625" y="88">socket</text>
  <path class="good" d="M631.5,133.2 L567.5,141.5" marker-end="url(#g)"/>
  <path class="thin" d="M502.0,169.5 L502.0,224.0" marker-end="url(#t)"/>
  <rect class="mod" x="439.5" y="131.5" width="125.0" height="37" rx="5"/>
  <text class="mono bold" x="502.0" y="147.5" text-anchor="middle">Stream::new</text>
  <text class="mono code muted" x="502.0" y="162.5" text-anchor="middle">&lt;= BACKLOG_MOST</text>
  <rect class="goodbox" x="448.2" y="227.0" width="107.6" height="26" rx="5"/>
  <text class="mono goodtext" x="502.0" y="244" text-anchor="middle">BACKLOG_MOST</text>
  <rect class="mod" x="632.5" y="106.5" width="125.0" height="37" rx="5"/>
  <text class="mono bold" x="695.0" y="122.5" text-anchor="middle">listen()</text>
  <text class="mono code muted" x="695.0" y="137.5" text-anchor="middle">Stream::new(..)</text>
  <text class="small muted" x="775" y="35" text-anchor="end">BACKLOG_MOST moved to where it is used</text>
</svg>
